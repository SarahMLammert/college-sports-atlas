<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Coaching Moves</title>
<meta name="description" content="Where college coaches moved from school to school, season by season.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../common.css">
<style>
/* The Transfer Map's layout (players-transfers.html) for coaches: the map of moves on the left, the lists on the
   right, with the filters in a row under the title instead of a dropdown. The words are the sport's own, set by
   the script from staff_data.json, so this page is the same file for every sport (scripts/sync_pages.py). */
body { background: var(--panel) var(--paper-grain); }
.bar { position: static; padding-bottom: 6px; }
.tools { justify-content: flex-end; }
@media (min-width: 1101px) {
  .brand { padding: 8px 14px 9px; max-width: none; }
  .brand h1 { font-size: 26px; white-space: nowrap; }
  .brand .sub { margin-top: 2px; }
}
.page { padding: 0 max(var(--gap), env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 10px; }
.ctl { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 16px; }
.ctl > div { display: flex; flex-direction: column; gap: 5px; }
.ctl .field { width: auto; }
.ctl #school { width: 230px; }
.ctl .row { display: flex; align-items: center; gap: 6px; }
.head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 18px; min-height: 22px; }
.key { display: inline-flex; align-items: center; gap: 6px 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.key svg { vertical-align: middle; margin-right: 5px; }
.tgrid { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 14px; height: max(460px, calc(100dvh - 190px)); }
.tmap { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sea); min-height: 0; }
.tmap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; }
.tmap canvas.hot { cursor: pointer; }
.ttip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-size: 13px; line-height: 1.35; box-shadow: var(--shadow); white-space: nowrap; font-variant-numeric: tabular-nums; z-index: 2; }
.ttip .note { font-size: 12px; }
.tside { border: 1px solid var(--line); border-radius: 8px; overflow: auto; overscroll-behavior: contain; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.sel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.sel-head h2 { font-size: 24px; }
.sel-head .note { margin-top: 3px; }
.big { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.big div { display: flex; flex-direction: column; }
.big b { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.big b.in { color: var(--in); } .big b.out { color: var(--out); }
.big small { color: var(--muted); font-size: 12px; line-height: 1.3; margin-top: 2px; }
.group h2 { font-size: 18px; }
.group .note { margin: -2px 0 4px; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.tl li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 14px; border-radius: 4px; }
.tl li.hl { background: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl .arrow { color: var(--muted); margin: 0 4px; }
.tl .v { font-variant-numeric: tabular-nums; color: var(--muted); }
.tl .v b { color: var(--fg); font-weight: 600; }
.tl .b { grid-column: 1 / -1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.tl .b span { display: block; height: 100%; background: var(--bar-c, var(--accent)); }
.tl.in .b span { --bar-c: var(--in); } .tl.out .b span { --bar-c: var(--out); }
.pl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pl li { font-size: 14px; line-height: 1.35; border-radius: 4px; }
.pl li.hl { background: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-soft); }
.pl .yr { font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 6px; }
.pl .sub2 { display: block; color: var(--muted); font-size: 12.5px; }
.pl .head-job { color: var(--accent); font-weight: 600; }
button.nmb { all: unset; cursor: pointer; border-bottom: 1px dotted var(--muted); }
button.nmb:hover { border-bottom-color: var(--fg); }
button.nmb:focus-visible, a.nmb:focus-visible { outline: 2px solid var(--focus); }
a.nmb { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); font-weight: 600; }
a.nmb:hover { border-bottom-color: var(--fg); }
.more { align-self: flex-start; }
.tside .fine { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }
:root { --in: var(--accent); --out: #23606b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --out: #7fc4cf; } }
:root[data-theme="dark"] { --out: #7fc4cf; }
@media (max-width: 1000px) {
  .tgrid { grid-template-columns: 1fr; height: auto; }
  .tmap { aspect-ratio: 1.55; }
  .tside { overflow: visible; }
}
@media (max-width: 560px) { .ctl #school { width: 100%; } .ctl > div:first-child { flex: 1 1 100%; } }
</style>
</head>
<body>
<div class="loading" id="loading">Loading coaches…</div>

<header class="bar" id="bar">
  <div class="brand card">
    <h1>College <span id="sportName"></span> <span>Coaching Moves</span></h1>
    <p class="sub" id="sub">Where coaches went from school to school</p>
  </div>
  <div class="tools">
    <a class="btn icon" href="../index.html" aria-label="All sports" title="All sports">
      <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 2"/><circle cx="9" cy="2.5" r="1.8" fill="currentColor"/><circle cx="15.5" cy="9" r="1.8" fill="currentColor"/><circle cx="9" cy="15.5" r="1.8" fill="currentColor"/><circle cx="2.5" cy="9" r="1.8" fill="currentColor"/></svg>
    </a>
    <a class="btn" id="dirLink" href="staff-directory.html" title="Every school's coaches and staff, season by season">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 4h12M3 9h12M3 14h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span class="txt">Staff directory</span>
    </a>
    <a class="btn" href="players-dotmap.html" title="The players' dot map">
      <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="5" cy="6" r="2.2" fill="currentColor"/><circle cx="12.5" cy="5" r="1.5" fill="currentColor"/><circle cx="10" cy="12" r="3" fill="currentColor"/></svg>
      <span class="txt">Players</span>
    </a>
    <div style="position:relative">
      <button type="button" class="btn icon" id="share" aria-label="Copy a link to this view" title="Copy a link to this view">
        <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M7.5 10.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2l-.9.9M10.5 7.5a3 3 0 0 0-4.2 0L3.7 10.1a3 3 0 0 0 4.2 4.2l.9-.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
  </div>
</header>

<main class="page">
  <div class="ctl">
    <div>
      <label class="label" for="school">School</label>
      <input class="field" id="school" list="schoolList" placeholder="All schools" autocomplete="off">
      <datalist id="schoolList"></datalist>
    </div>
    <div>
      <span class="label" id="roleLabel">Moves into</span>
      <div class="seg" id="role" role="group" aria-labelledby="roleLabel">
        <button type="button" data-v="head">Head coach jobs</button>
        <button type="button" data-v="coach">Coaching jobs</button>
        <button type="button" data-v="all">Any staff job</button>
      </div>
    </div>
    <div>
      <label class="label" for="div">Division</label>
      <select class="field" id="div"><option value="">All divisions</option></select>
    </div>
    <div>
      <label class="label" for="conf">Conference</label>
      <select class="field" id="conf"><option value="">All conferences</option></select>
    </div>
    <div>
      <span class="label">First season at the new school</span>
      <div class="row"><select class="field" id="from" aria-label="From season"></select><span class="note">to</span><select class="field" id="to" aria-label="To season"></select></div>
    </div>
  </div>
  <div class="head">
    <span class="note" id="hint">Hover a campus to see its coaching moves; click it to pick that school</span>
    <span class="key" id="key"></span>
  </div>
  <div class="tgrid">
    <div class="tmap" id="tmap">
      <canvas id="cv" aria-label="Map of coaching moves between schools. The lists beside it give the same moves."></canvas>
      <div class="ttip" id="ttip" hidden></div>
    </div>
    <aside class="tside" id="side" aria-live="polite"></aside>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="../common.js"></script>
<script>
(async function () {
  const { $, fmt, esc, css } = GP;
  let data;
  try {
    data = await fetch("staff_data.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }); data.stints = GP.unpackStints(data.stints);
  } catch (e) { $("loading").textContent = "The coaches' data didn't load. If you opened this file directly, serve the folder instead (python -m http.server), or reload to try again."; return; }
  let loc = null;
  try { loc = await fetch("school_locations.json").then((r) => r.ok ? r.json() : null); } catch (e) {}
  data.campus = data.schools.map((s) => { const v = loc && loc.schools[s[0]]; return v ? { city: v[0], state: v[1], lat: v[2], lon: v[3] } : null; });

  // "Lacrosse (Men's)" -> "Men's Lacrosse"
  const sportWords = data.sport.replace(/^(.*) \((.*)\)$/, "$2 $1");
  $("sportName").textContent = sportWords;
  document.title = `College ${sportWords} Coaching Moves`;

  const people = data.people.split("\n"), ROLES = data.roles, RL = data.roleLabels;
  const HEAD = ROLES.indexOf("head"), SUPPORT = ROLES.indexOf("support");
  const MV = data.moves, NM = MV.p.length, S = data.schools.length;
  const ST = data.stints;
  const SEASONS = [...new Set(MV.y)].sort((a, b) => a - b);
  const FIRST = Math.min(...ST.y), LAST = Math.max(...ST.y);
  $("sub").textContent = `Where coaches went from school to school, ${FIRST}–${LAST}`;
  const { schoolPalette, swatch } = GP.makePalette(data);
  const name = (i) => esc(data.schools[i][0]);
  const schoolIndex = new Map(data.schools.map((s, i) => [s[0].toLowerCase(), i]));
  // the title each person had in each move's seasons: the stint at the old school's last season and the new one's first
  const stintAt = new Map();   // person * 1e6 + school * 100 + (season - 2000) -> title id
  for (let k = 0; k < ST.p.length; k++) stintAt.set(ST.p[k] * 1e6 + ST.s[k] * 100 + (ST.y[k] - 2000), ST.t[k]);
  const lastSeasonAt = (p, s, y) => { for (let yy = y; yy >= y - 3; yy--) { const t = stintAt.get(p * 1e6 + s * 100 + (yy - 2000)); if (t !== undefined) return [yy, t]; } return [y, -1]; };
  const titleOf = (t) => t >= 0 ? data.titles[t] : "";

  // ---------- controls ----------
  const state = { school: -1, role: "coach", div: "", conf: "", from: SEASONS[0], to: SEASONS[SEASONS.length - 1] };
  $("schoolList").innerHTML = data.schools.map((s) => `<option value="${esc(s[0])}">`).join("");
  const usedConfs = [...new Set(data.schools.map((s) => s[1]))].filter((c) => data.confs[c]).sort((a, b) => data.confs[a].localeCompare(data.confs[b]));
  $("conf").innerHTML += usedConfs.map((c) => `<option value="${c}">${esc(data.confs[c])}</option>`).join("");
  $("div").innerHTML += data.divs.map((d, i) => `<option value="${i}">${esc(data.divLabels[d] || d)}</option>`).join("");
  const opts = SEASONS.map((y) => `<option value="${y}">${y}</option>`).join("");
  $("from").innerHTML = opts; $("to").innerHTML = opts;
  function sync() {
    $("school").value = state.school >= 0 ? data.schools[state.school][0] : "";
    $("role").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.role));
    $("div").value = state.div; $("conf").value = state.conf;
    $("from").value = state.from; $("to").value = state.to;
  }
  $("school").addEventListener("change", () => {
    const v = $("school").value.trim().toLowerCase();
    if (!v) return pick(-1);
    const i = schoolIndex.has(v) ? schoolIndex.get(v) : data.schools.findIndex((s) => s[0].toLowerCase().startsWith(v));
    if (i >= 0) pick(i); else sync();
  });
  $("role").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.role = b.dataset.v; refresh(); } });
  $("div").addEventListener("change", () => { state.div = $("div").value; refresh(); });
  $("conf").addEventListener("change", () => { state.conf = $("conf").value; refresh(); });
  $("from").addEventListener("change", () => { state.from = +$("from").value; if (state.to < state.from) state.to = state.from; refresh(); });
  $("to").addEventListener("change", () => { state.to = +$("to").value; if (state.from > state.to) state.from = state.to; refresh(); });

  // ---------- counting ----------
  // A move: someone's last season at school a, then their first at school b within two seasons (build_staff_data.py).
  // "Moves into" filters by the job at the new school; division and conference keep moves to or from a school in them.
  let M = null;
  function roleOk(r) { return state.role === "all" || (state.role === "head" ? r === HEAD : r !== SUPPORT); }
  function compute() {
    const sel = state.school, conf = state.conf === "" ? -1 : +state.conf, div = state.div === "" ? -1 : +state.div;
    const inn = new Int32Array(S), out = new Int32Array(S), pairs = new Map(), list = [];
    for (let k = 0; k < NM; k++) {
      const y = MV.y[k]; if (y < state.from || y > state.to || !roleOk(MV.rb[k])) continue;
      const a = MV.a[k], b = MV.b[k], sa = data.schools[a], sb = data.schools[b];
      if (conf >= 0 && sa[1] !== conf && sb[1] !== conf) continue;
      if (div >= 0 && sa[2] !== div && sb[2] !== div) continue;
      if (sel >= 0 && a !== sel && b !== sel) continue;
      inn[b]++; out[a]++; list.push(k);
      const key = a * S + b; pairs.set(key, (pairs.get(key) || 0) + 1);
    }
    const routes = [...pairs.entries()].map(([key, n]) => ({ from: Math.floor(key / S), to: key % S, n })).sort((x, y) => y.n - x.n || x.from - y.from);
    list.sort((x, y) => MV.y[y] - MV.y[x] || (MV.rb[x] === HEAD ? -1 : 0) - (MV.rb[y] === HEAD ? -1 : 0) || MV.rb[x] - MV.rb[y]);
    M = { sel, inn, out, routes, list };
  }

  // ---------- the map (as on the Transfer Map) ----------
  const albers = d3.geoAlbersUsa();
  const US_FIT = { type: "MultiPoint", coordinates: [[-124.7, 48.4], [-67, 47.4], [-80.1, 25.1], [-117.1, 32.5], [-97.2, 25.9], [-160, 21], [-150, 61]] };
  const cv = $("cv"), g = cv.getContext("2d");
  let size = { w: 0, h: 0, dpr: 1 }, statePaths = [], stateFeatures = [], campusXY = [], hoverSchool = -1, hoverRoute = null;
  const MAX_ARCS = 450;
  function layout() {
    const r = $("tmap").getBoundingClientRect(); if (!r.width) return;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    size = { w: r.width, h: r.height, dpr };
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    albers.fitExtent([[12, 12], [r.width - 12, r.height - 12]], US_FIT);
    const path = d3.geoPath(albers);
    statePaths = stateFeatures.map((f) => new Path2D(path(f) || ""));
    campusXY = data.campus.map((c) => c ? albers([c.lon, c.lat]) : null);
    draw();
  }
  function curve(a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, bend = Math.min(.22 * len, 90);
    return { a, b, c: [(a[0] + b[0]) / 2 + dy / len * bend, (a[1] + b[1]) / 2 - dx / len * bend] };
  }
  function arrowHead(q, color, w) {
    const ang = Math.atan2(q.b[1] - q.c[1], q.b[0] - q.c[0]), s = 4 + w * 1.6, tip = [q.b[0] - Math.cos(ang) * 5, q.b[1] - Math.sin(ang) * 5];
    g.beginPath(); g.moveTo(tip[0], tip[1]);
    g.lineTo(tip[0] - Math.cos(ang - .45) * s, tip[1] - Math.sin(ang - .45) * s);
    g.lineTo(tip[0] - Math.cos(ang + .45) * s, tip[1] - Math.sin(ang + .45) * s);
    g.closePath(); g.fillStyle = color; g.fill();
  }
  function stroke(q) { g.beginPath(); g.moveTo(q.a[0], q.a[1]); g.quadraticCurveTo(q.c[0], q.c[1], q.b[0], q.b[1]); g.stroke(); }
  function draw() {
    if (!size.w || !M) return;
    const { w, h, dpr } = size, fg = css("--fg"), panel = css("--panel"), cIn = css("--in"), cOut = css("--out"), muted = css("--muted");
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    g.fillStyle = css("--land"); for (const p of statePaths) g.fill(p);
    g.strokeStyle = css("--border"); g.lineWidth = .7; for (const p of statePaths) g.stroke(p);
    const sel = M.sel, drawable = M.routes.filter((r) => campusXY[r.from] && campusXY[r.to]);
    const shown = sel >= 0 ? drawable : drawable.slice(0, MAX_ARCS);
    const maxN = Math.max(1, ...shown.map((r) => r.n)), width = (n) => .8 + 4.6 * Math.sqrt(n / maxN);
    g.lineCap = "round";
    for (let i = shown.length - 1; i >= 0; i--) {
      const r = shown[i], q = curve(campusXY[r.from], campusXY[r.to]), color = sel < 0 ? muted : r.to === sel ? cIn : cOut;
      g.globalAlpha = sel < 0 ? .2 + .5 * Math.sqrt(r.n / maxN) : .4 + .5 * Math.sqrt(r.n / maxN);
      g.strokeStyle = color; g.lineWidth = width(r.n); stroke(q);
      if (sel >= 0) arrowHead(q, color, width(r.n));
    }
    g.globalAlpha = 1;
    const hr = hoverRoute && campusXY[hoverRoute.from] && campusXY[hoverRoute.to] ? hoverRoute : null;
    if (hr) {
      const q = curve(campusXY[hr.from], campusXY[hr.to]), color = sel < 0 ? css("--accent") : hr.to === sel ? cIn : cOut, lw = Math.max(2.5, width(hr.n) + 1);
      g.strokeStyle = panel; g.lineWidth = lw + 3; stroke(q);
      g.strokeStyle = color; g.lineWidth = lw; stroke(q); arrowHead(q, color, lw);
    }
    const busy = (i) => M.inn[i] + M.out[i], maxB = Math.max(1, ...data.schools.map((_, i) => busy(i))), pal = schoolPalette();
    const order = data.schools.map((_, i) => i).filter((i) => campusXY[i]).sort((a, b) => busy(a) - busy(b));
    for (const i of order) {
      const p = campusXY[i], b = busy(i), r = i === sel ? 7 : b ? 2.2 + 4.3 * Math.sqrt(b / maxB) : 1.6;
      g.globalAlpha = sel < 0 || i === sel || b > 0 ? 1 : .35;
      g.beginPath(); g.arc(p[0], p[1], r, 0, Math.PI * 2);
      g.fillStyle = b || i === sel ? pal[i].fill : muted; g.fill();
      g.lineWidth = i === sel || i === hoverSchool ? 2.5 : 1; g.strokeStyle = i === hoverSchool ? fg : panel; g.stroke();
    }
    g.globalAlpha = 1;
    if (sel >= 0 && campusXY[sel]) {
      const p = campusXY[sel], label = data.schools[sel][0];
      g.font = `600 13px ${css("--body")}`; g.textBaseline = "middle";
      const tw = g.measureText(label).width, x = Math.min(p[0] + 12, w - tw - 8);
      g.lineWidth = 4; g.strokeStyle = panel; g.strokeText(label, x, p[1]); g.fillStyle = fg; g.fillText(label, x, p[1]);
    }
  }
  function schoolAt(mx, my) {
    let best = -1, bd = 14 * 14;
    campusXY.forEach((p, i) => { if (!p) return; const d = (p[0] - mx) ** 2 + (p[1] - my) ** 2; if (d < bd && (M.inn[i] || M.out[i] || i === M.sel)) { bd = d; best = i; } });
    return best;
  }
  function routeAt(mx, my) {
    if (M.sel < 0) return null;
    let best = null, bd = 8;
    for (const r of M.routes) {
      const a = campusXY[r.from], b = campusXY[r.to]; if (!a || !b) continue;
      const q = curve(a, b);
      for (let t = 0; t <= 1; t += .05) {
        const x = (1 - t) ** 2 * q.a[0] + 2 * (1 - t) * t * q.c[0] + t * t * q.b[0], y = (1 - t) ** 2 * q.a[1] + 2 * (1 - t) * t * q.c[1] + t * t * q.b[1];
        const d = Math.hypot(x - mx, y - my); if (d < bd) { bd = d; best = r; }
      }
    }
    return best;
  }
  function showTip(html, x, y) {
    const tip = $("ttip"); tip.innerHTML = html; tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(6, Math.min(x + 14, size.w - tw - 6)) + "px";
    tip.style.top = Math.max(6, y - th - 10 < 6 ? y + 16 : y - th - 10) + "px";
  }
  const plural = (n, w) => `${fmt(n)} ${w}${n === 1 ? "" : "s"}`;
  // the people on a route, for its tooltip (up to four names)
  function routePeople(r) {
    const ks = M.list.filter((k) => MV.a[k] === r.from && MV.b[k] === r.to);
    const names = ks.slice(0, 4).map((k) => `${MV.y[k]} ${esc(people[MV.p[k]])}`).join("<br>");
    return names + (ks.length > 4 ? `<br><span class="note">+${fmt(ks.length - 4)} more</span>` : "");
  }
  cv.addEventListener("pointermove", (e) => {
    if (!M || !size.w) return;
    const rect = cv.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const si = schoolAt(mx, my), r = si < 0 ? routeAt(mx, my) : null;
    if (si !== hoverSchool || r !== hoverRoute) { hoverSchool = si; hoverRoute = r; draw(); highlightList(); }
    cv.classList.toggle("hot", si >= 0);
    if (si >= 0) showTip(`${swatch(si)}<b>${name(si)}</b><br>${fmt(M.inn[si])} came in · ${fmt(M.out[si])} left${si === M.sel ? "" : `<br><span class="note">Click to pick this school</span>`}`, mx, my);
    else if (r) showTip(`${swatch(r.from)}${name(r.from)} <span class="note">→</span> ${swatch(r.to)}${name(r.to)}<br>${routePeople(r)}`, mx, my);
    else $("ttip").hidden = true;
  });
  cv.addEventListener("pointerleave", () => { hoverSchool = -1; hoverRoute = null; $("ttip").hidden = true; draw(); highlightList(); });
  cv.addEventListener("click", (e) => {
    const rect = cv.getBoundingClientRect(), si = schoolAt(e.clientX - rect.left, e.clientY - rect.top);
    if (si >= 0 && si !== M.sel) pick(si);
  });

  // ---------- the lists ----------
  const pickBtn = (i) => `<button type="button" class="nmb" data-pick="${i}" title="Show ${name(i)}'s coaching moves">${swatch(i)}${name(i)}</button>`;
  const personLink = (p) => `<a class="nmb" href="staff-directory.html#person=${encodeURIComponent(people[p])}" title="${esc(people[p])}'s seasons, school by school">${esc(people[p])}</a>`;
  const top = (arr, n = 10) => Array.from(arr, (v, i) => ({ i, n: v })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n || a.i - b.i).slice(0, n);
  function bars(rows, cls, max) {
    if (!rows.length) return `<p class="note">None with these filters.</p>`;
    return `<ol class="tl ${cls}">${rows.map((r) => `<li data-from="${r.from}" data-to="${r.to}"><span class="nm">${r.label}</span><span class="v"><b>${fmt(r.n)}</b></span><span class="b"><span style="width:${(r.n / max * 100).toFixed(1)}%"></span></span></li>`).join("")}</ol>`;
  }
  // one move: "2024  Kalen DeBoer — Head coach / from Washington, Head coach"
  function moveRow(k, side) {
    const p = MV.p[k], a = MV.a[k], b = MV.b[k], y = MV.y[k];
    const [ya, ta] = lastSeasonAt(p, a, y - 1), tb = stintAt.get(p * 1e6 + b * 100 + (y - 2000));
    const job = (r, t) => `${r === HEAD ? `<span class="head-job">${esc(titleOf(t) || RL[r])}</span>` : esc(titleOf(t) || RL[r])}`;
    const there = side === "in" ? `from ${pickBtn(a)}, ${job(MV.ra[k], ta)} (${ya})` : side === "out" ? `to ${pickBtn(b)} as ${job(MV.rb[k], tb)}` : `${pickBtn(a)}<span class="arrow">→</span>${pickBtn(b)}`;
    const here = side === "in" ? job(MV.rb[k], tb) : side === "out" ? `${job(MV.ra[k], ta)} here through ${ya}` : job(MV.rb[k], tb);
    return `<li data-from="${a}" data-to="${b}"><span class="yr">${y}</span>${personLink(p)} · ${here}<span class="sub2">${there}</span></li>`;
  }
  let showAll = { in: 30, out: 30, all: 25 };
  function moveList(ks, side) {
    if (!ks.length) return `<p class="note">None with these filters.</p>`;
    const n = showAll[side];
    return `<ol class="pl">${ks.slice(0, n).map((k) => moveRow(k, side)).join("")}</ol>${ks.length > n ? `<button type="button" class="link more" data-more="${side}">Show ${fmt(Math.min(ks.length - n, 100))} more of ${fmt(ks.length - n)}</button>` : ""}`;
  }
  const fine = `<p class="fine">A move is one person on two schools' staff pages in turn: the last season listed at one school, then the first at the next, at most two seasons later. The season is the one on the new school's page. People are matched by name within this sport, so two coaches with the same name can be mixed up; a name listed at two schools in two or more of the same seasons is kept as two people, with no moves. Seasons a school didn't post its staff for are gaps, so a coach whose old school is missing that season may show no move. Moves from schools outside this data (high schools, the NFL, other levels) aren't counted.</p>`;
  function renderSide() {
    const side = $("side"), sel = M.sel;
    const roleWord = state.role === "head" ? "head coaching jobs" : state.role === "coach" ? "coaching jobs" : "staff jobs";
    if (sel < 0) {
      const dest = top(M.inn), src = top(M.out), routes = M.routes.slice(0, 10);
      const heads = M.list.filter((k) => MV.rb[k] === HEAD).length;
      side.innerHTML = `<div class="big">
          <div><b>${fmt(M.list.length)}</b><small>moves into ${roleWord}, ${state.from}–${state.to}</small></div>
          <div><b class="in">${fmt(heads)}</b><small>of them into a head coach's job</small></div>
        </div>
        <div class="group"><h2>Latest moves</h2><p class="note">Head coaches first in each season</p>${moveList(M.list, "all")}</div>
        <div class="group"><h2>Most hires from other schools</h2>${bars(dest.map((x) => ({ label: pickBtn(x.i), n: x.n, from: -1, to: x.i })), "in", dest.length ? dest[0].n : 1)}</div>
        <div class="group"><h2>Most coaches hired away</h2>${bars(src.map((x) => ({ label: pickBtn(x.i), n: x.n, from: x.i, to: -1 })), "out", src.length ? src[0].n : 1)}</div>
        <div class="group"><h2>Most common moves</h2>${bars(routes.map((r) => ({ label: `${pickBtn(r.from)}<span class="arrow">→</span>${pickBtn(r.to)}`, n: r.n, from: r.from, to: r.to })), "", routes.length ? routes[0].n : 1)}</div>
        ${fine}`;
    } else {
      const ins = M.list.filter((k) => MV.b[k] === sel), outs = M.list.filter((k) => MV.a[k] === sel), camp = data.campus[sel];
      side.innerHTML = `<div class="sel-head"><div><h2>${swatch(sel)}${name(sel)}</h2>
          <p class="note">${camp ? `${esc(camp.city)}, ${esc(camp.state)} · ` : ""}${esc(data.confs[data.schools[sel][1]] || "")} · <a href="staff-directory.html#school=${encodeURIComponent(data.schools[sel][0])}">Staff by season</a></p></div>
          <button type="button" class="link" id="clearSel">All schools</button></div>
        <div class="big">
          <div><b class="in">${fmt(ins.length)}</b><small>hired from other schools</small></div>
          <div><b class="out">${fmt(outs.length)}</b><small>left for other schools</small></div>
        </div>
        <div class="group"><h2>Came in</h2>${moveList(ins, "in")}</div>
        <div class="group"><h2>Left</h2>${moveList(outs, "out")}</div>
        ${fine}`;
      $("clearSel").addEventListener("click", () => pick(-1));
    }
  }
  $("side").addEventListener("click", (e) => {
    const b = e.target.closest("[data-pick]"); if (b) return pick(+b.dataset.pick);
    const m = e.target.closest("[data-more]"); if (m) { showAll[m.dataset.more] += 100; renderSide(); }
  });
  $("side").addEventListener("pointerover", (e) => {
    const li = e.target.closest("li[data-from]"); if (!li) return;
    const from = +li.dataset.from, to = +li.dataset.to;
    const r = from >= 0 && to >= 0 ? M.routes.find((x) => x.from === from && x.to === to) : null;
    const si = r ? -1 : from >= 0 ? from : to;
    if (r !== hoverRoute || si !== hoverSchool) { hoverRoute = r; hoverSchool = si; draw(); }
  });
  $("side").addEventListener("pointerleave", () => { hoverRoute = null; hoverSchool = -1; draw(); });
  function highlightList() {
    $("side").querySelectorAll("li[data-from]").forEach((li) => {
      const f = +li.dataset.from, t = +li.dataset.to;
      li.classList.toggle("hl", !!(hoverRoute && hoverRoute.from === f && hoverRoute.to === t) || (hoverSchool >= 0 && f === -1 && t === hoverSchool) || (hoverSchool >= 0 && t === -1 && f === hoverSchool));
    });
  }
  function drawKey() {
    const line = (c) => `<svg width="22" height="8" aria-hidden="true"><line x1="1" y1="4" x2="21" y2="4" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;
    $("key").innerHTML = M.sel >= 0
      ? `<span>${line(css("--in"))}Came in</span><span>${line(css("--out"))}Left</span><span>Thicker = more people</span>`
      : `<span>${line(css("--muted"))}Busiest ${fmt(Math.min(MAX_ARCS, M.routes.length))} routes; thicker = more people</span><span>Dot size = moves in and out</span>`;
  }

  // ---------- links: staff-moves.html#school=Alabama&role=head&from=2020 ----------
  let lastHash = "";
  const SAVE_KEY = GP.saveKey("staff-moves:last");
  function hashNow() {
    const q = new URLSearchParams();
    if (state.school >= 0) q.set("school", data.schools[state.school][0]);
    if (state.role !== "coach") q.set("role", state.role);
    if (state.div !== "") q.set("div", data.divs[+state.div]);
    if (state.conf !== "") q.set("conf", data.confs[+state.conf]);
    if (state.from !== SEASONS[0]) q.set("from", state.from);
    if (state.to !== SEASONS[SEASONS.length - 1]) q.set("to", state.to);
    return q.toString();
  }
  function writeUrl() {
    const h = hashNow(); lastHash = h;
    try { localStorage.setItem(SAVE_KEY, h); } catch (e) {}
    try { history.replaceState(null, "", location.pathname + location.search + (h ? "#" + h : "")); } catch (e) {}
  }
  function readUrl(firstLoad) {
    let hash = location.hash.slice(1);
    if (!hash && firstLoad) hash = GP.readSaved("staff-moves:last") || "";
    const q = new URLSearchParams(hash), sc = (q.get("school") || "").toLowerCase();
    state.school = schoolIndex.has(sc) ? schoolIndex.get(sc) : -1;
    state.role = ["head", "coach", "all"].includes(q.get("role")) ? q.get("role") : "coach";
    const d = data.divs.indexOf(q.get("div")); state.div = d >= 0 ? String(d) : "";
    const c = data.confs.indexOf(q.get("conf")); state.conf = c > 0 ? String(c) : "";
    const f = +q.get("from"), t = +q.get("to");
    state.from = SEASONS.includes(f) ? f : SEASONS[0]; state.to = SEASONS.includes(t) && t >= state.from ? t : SEASONS[SEASONS.length - 1];
  }
  addEventListener("hashchange", () => { if (location.hash.slice(1) !== lastHash) { readUrl(); refresh(); } });
  $("share").addEventListener("click", () => { writeUrl(); GP.copyLink($("toast")); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.school >= 0 && !e.target.closest("input")) pick(-1); });

  function pick(i) { state.school = i; hoverRoute = null; hoverSchool = -1; $("ttip").hidden = true; showAll = { in: 30, out: 30, all: 25 }; refresh(); }
  function refresh() {
    sync(); compute(); renderSide(); drawKey(); draw(); writeUrl();
    $("dirLink").href = "staff-directory.html" + (state.school >= 0 ? "#school=" + encodeURIComponent(data.schools[state.school][0]) : "");
    $("hint").textContent = M.sel >= 0 ? "Hover a line to see who made that move; click another campus to switch schools" : "Hover a campus to see its coaching moves; click it to pick that school";
  }
  readUrl(true);
  $("loading").remove();
  refresh();
  new ResizeObserver(layout).observe($("tmap"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { drawKey(); draw(); renderSide(); });
  layout();
  try {
    const us = await fetch("https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
    stateFeatures = topojson.feature(us, us.objects.states).features.filter((f) => f.properties.name !== "Puerto Rico");
    layout();
  } catch (e) { $("hint").textContent = "The state outlines didn't load; the campuses and moves still draw in the right places."; }
})();
</script>
</body>
</html>
