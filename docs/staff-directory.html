<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Coaching Staffs</title>
<meta name="description" content="Every school's coaches and staff, season by season, and each coach's career.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="common.css">
<style>
/* A school's staff for a season on the left; one person's seasons, school by school, on the right.
   The words are set by the script from staff_data.json, so this page is the same file for every sport. */
body { background: var(--panel) var(--paper-grain); }
.bar { position: static; padding-bottom: 6px; }
.tools { justify-content: flex-end; }
@media (min-width: 1101px) {
  .brand { padding: 8px 14px 9px; max-width: none; }
  .brand h1 { font-size: 26px; white-space: nowrap; }
  .brand .sub { margin-top: 2px; }
}
.page { padding: 0 max(var(--gap), env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left)); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; background: var(--panel); min-width: 0; }
.ctl { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; }
.ctl > div { display: flex; flex-direction: column; gap: 5px; }
.ctl .grow { flex: 1 1 220px; }
.box h2 { font-size: 24px; }
.box h3 { font: 600 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 4px 0 6px; }
.staff { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.staff li { display: grid; grid-template-columns: minmax(0, 13em) minmax(0, 1fr); gap: 2px 12px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.35; }
.staff li:first-child { border-top: 0; }
.staff .t { color: var(--muted); }
.staff li.on { background: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-soft); border-radius: 3px; }
button.nmb { all: unset; cursor: pointer; font-weight: 600; border-bottom: 1px dotted var(--muted); }
button.nmb:hover { border-bottom-color: var(--fg); }
button.nmb:focus-visible { outline: 2px solid var(--focus); }
.heads { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
.heads span b { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; margin-right: 4px; }
.seasons { display: flex; flex-wrap: wrap; gap: 4px; }
.seasons button { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 3px 9px; cursor: pointer; font-size: 13px; font-variant-numeric: tabular-nums; }
.seasons button[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }
.search { position: relative; }
.sugg { position: absolute; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px 0; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); z-index: 5; max-height: 320px; overflow: auto; }
.sugg li { padding: 6px 10px; cursor: pointer; font-size: 14px; }
.sugg li small { color: var(--muted); margin-left: 6px; }
.sugg li[aria-selected="true"], .sugg li:hover { background: var(--accent-soft); }
.career { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.career li { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 2px 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.35; }
.career li:first-child { border-top: 0; }
.career .yr { font-variant-numeric: tabular-nums; color: var(--muted); }
.career .t { display: block; color: var(--muted); }
.career .head-job .t { color: var(--accent); font-weight: 600; }
.empty { color: var(--muted); font-size: 14px; }
.fine { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }
@media (max-width: 900px) { .page { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .staff li { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="loading" id="loading">Loading coaches…</div>

<header class="bar" id="bar">
  <div class="brand card">
    <h1>College <span id="sportName"></span> <span>Coaching Staffs</span></h1>
    <p class="sub" id="sub">Every school's coaches and staff, season by season</p>
  </div>
  <div class="tools">
    <a class="btn icon" href="index.html" aria-label="All sports" title="All sports">
      <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 2"/><circle cx="9" cy="2.5" r="1.8" fill="currentColor"/><circle cx="15.5" cy="9" r="1.8" fill="currentColor"/><circle cx="9" cy="15.5" r="1.8" fill="currentColor"/><circle cx="2.5" cy="9" r="1.8" fill="currentColor"/></svg>
    </a>
    <a class="btn" id="movesLink" href="staff-moves.html" title="The map of coaches moving between schools">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 14C5 6 11 4 15 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"/><path d="M11.5 2.8L15 5l-2.6 3.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span class="txt">Coaching moves</span>
    </a>
    <a class="btn" href="players-dotmap.html" title="The players' dot map">
      <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="5" cy="6" r="2.2" fill="currentColor"/><circle cx="12.5" cy="5" r="1.5" fill="currentColor"/><circle cx="10" cy="12" r="3" fill="currentColor"/></svg>
      <span class="txt">Players</span>
    </a>
    <div style="position:relative">
      <button type="button" class="btn icon" id="share" aria-label="Copy a link to this view" title="Copy a link to this view">
        <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M7.5 10.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2l-.9.9M10.5 7.5a3 3 0 0 0-4.2 0L3.7 10.1a3 3 0 0 0 4.2 4.2l.9-.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
  </div>
</header>

<main class="page">
  <section class="box" aria-labelledby="schoolTitle">
    <div class="ctl">
      <div class="grow">
        <label class="label" for="school">School</label>
        <input class="field" id="school" list="schoolList" placeholder="Type a school" autocomplete="off">
        <datalist id="schoolList"></datalist>
      </div>
      <div>
        <span class="label" id="roleLabel">Show</span>
        <div class="seg" id="role" role="group" aria-labelledby="roleLabel">
          <button type="button" data-v="coach">Coaches</button>
          <button type="button" data-v="all">Everyone</button>
        </div>
      </div>
    </div>
    <div id="schoolOut"></div>
  </section>
  <section class="box" aria-labelledby="personTitle">
    <div class="search">
      <label class="label" for="who">Find a coach</label>
      <input class="field" id="who" placeholder="Type a name" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
      <ul class="sugg" id="sugg" role="listbox" hidden></ul>
    </div>
    <div id="personOut"><p class="empty">Pick a name in a staff list, or type one, to see that person's seasons school by school.</p></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="sports.js"></script>
<script src="common.js"></script>
<script>
(async function () {
  const { $, fmt, esc } = GP;
  let data;
  try { data = await fetch(GP.dataUrl("staff_data.json")).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }); data.stints = GP.unpackStints(data.stints); }
  catch (e) { $("loading").textContent = "The coaches' data didn't load. If you opened this file directly, serve the folder instead (python -m http.server), or reload to try again."; return; }
  const sportWords = data.sport.replace(/^(.*) \((.*)\)$/, "$2 $1");
  $("sportName").textContent = sportWords;
  document.title = `College ${sportWords} Coaching Staffs`;
  const people = data.people.split("\n"), ROLES = data.roles, RL = data.roleLabels, ST = data.stints, MV = data.moves;
  const HEAD = ROLES.indexOf("head"), SUPPORT = ROLES.indexOf("support");
  const FIRST = Math.min(...ST.y), LAST = Math.max(...ST.y);
  const SPRING = GP.springOf(data), lab = (y) => GP.seasonLabel(y, SPRING), span = (a, b) => GP.seasonSpan(a, b, SPRING);
  $("sub").textContent = `Every school's coaches and staff, season by season, ${span(FIRST, LAST)}`;
  const { swatch } = GP.makePalette(data);
  const schoolIndex = new Map(data.schools.map((s, i) => [s[0].toLowerCase(), i]));
  // indexes: the stints of each school and of each person
  const bySchool = data.schools.map(() => []), byPerson = people.map(() => []);
  for (let k = 0; k < ST.p.length; k++) { bySchool[ST.s[k]].push(k); byPerson[ST.p[k]].push(k); }
  const nameIndex = new Map();
  people.forEach((n, i) => { const key = n.toLowerCase(); if (!nameIndex.has(key)) nameIndex.set(key, []); nameIndex.get(key).push(i); });
  const plural = (l) => /coach$/.test(l) ? l + "es" : /staff$/.test(l) ? l : l + "s";
  const titleOf = (k) => data.titles[ST.t[k]] || RL[ST.r[k]];

  const state = { school: -1, season: 0, role: "coach", person: -1 };
  $("schoolList").innerHTML = data.schools.map((s, i) => bySchool[i].length ? `<option value="${esc(s[0])}">` : "").join("");

  // ---------- a school's staff ----------
  function seasonsOf(s) { return [...new Set(bySchool[s].map((k) => ST.y[k]))].sort((a, b) => a - b); }
  function renderSchool() {
    const out = $("schoolOut"), s = state.school;
    $("school").value = s >= 0 ? data.schools[s][0] : "";
    $("role").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.role));
    if (s < 0) { out.innerHTML = `<p class="empty">Type a school to see its coaches and staff for each season.</p>`; return; }
    const ys = seasonsOf(s);
    if (!ys.length) { out.innerHTML = `<h2 id="schoolTitle">${swatch(s)}${esc(data.schools[s][0])}</h2><p class="empty">No staff pages were found for this school.</p>`; return; }
    if (!ys.includes(state.season)) state.season = ys[ys.length - 1];
    const ks = bySchool[s].filter((k) => ST.y[k] === state.season && (state.role === "all" || ST.r[k] !== SUPPORT))
      .sort((a, b) => ST.r[a] - ST.r[b] || people[ST.p[a]].localeCompare(people[ST.p[b]]));
    const hidden = bySchool[s].filter((k) => ST.y[k] === state.season && ST.r[k] === SUPPORT).length;
    // head coaches, season by season, as runs: "2016–2019 Jim Smith"
    // (co-head coaches together: "2019–2022 Ann Lee & Bob Ray")
    const runs = [];
    for (const y of ys) {
      const ps = [...new Set(bySchool[s].filter((k) => ST.y[k] === y && ST.r[k] === HEAD).map((k) => ST.p[k]))].sort((a, b) => a - b);
      const key = ps.join(","), last = runs[runs.length - 1];
      if (last && last.key === key && last.to >= y - 2) last.to = y; else runs.push({ key, ps, from: y, to: y });
    }
    const conf = data.confs[data.schools[s][1]] || "", div = data.divs[data.schools[s][2]];
    const groups = [];
    for (const k of ks) { const r = ST.r[k]; if (!groups.length || groups[groups.length - 1].r !== r) groups.push({ r, ks: [] }); groups[groups.length - 1].ks.push(k); }
    const missing = [];
    for (let y = ys[0]; y <= ys[ys.length - 1]; y++) if (!ys.includes(y)) missing.push(y);
    out.innerHTML = `<h2 id="schoolTitle">${swatch(s)}${esc(data.schools[s][0])}</h2>
      <p class="note">${esc([data.divLabels[div] || div, conf].filter(Boolean).join(" · "))} · <a href="staff-moves.html#school=${encodeURIComponent(data.schools[s][0])}">Coaching moves in and out</a></p>
      <div><h3>Season</h3><div class="seasons" id="seasons">${ys.map((y) => `<button type="button" data-y="${y}" aria-pressed="${y === state.season}">${lab(y)}</button>`).join("")}</div>
      ${missing.length ? `<p class="note" style="margin-top:6px">No staff page found for ${missing.map(lab).join(", ")}.</p>` : ""}</div>
      <div><h3>Head coaches</h3><div class="heads">${runs.filter((r) => r.ps.length).map((r) => `<span><b>${span(r.from, r.to)}</b>${r.ps.map((p) => `<button type="button" class="nmb" data-p="${p}">${esc(people[p])}</button>`).join(" &amp; ")}</span>`).join("") || `<span class="empty">None listed</span>`}</div></div>
      ${groups.map((gr) => `<div><h3>${esc(gr.ks.length > 1 ? plural(RL[gr.r]) : RL[gr.r])}</h3><ul class="staff">${gr.ks.map((k) =>
        `<li class="${ST.p[k] === state.person ? "on" : ""}"><span><button type="button" class="nmb" data-p="${ST.p[k]}">${esc(people[ST.p[k]])}</button></span><span class="t">${esc(titleOf(k))}</span></li>`).join("")}</ul></div>`).join("")}
      ${hidden && state.role !== "all" ? `<p class="note">+${fmt(hidden)} support staff (operations, strength, video, trainers…): pick Everyone to list them.</p>` : ""}`;
  }
  $("schoolOut").addEventListener("click", (e) => {
    const y = e.target.closest("[data-y]"); if (y) { state.season = +y.dataset.y; update(); return; }
    const p = e.target.closest("[data-p]"); if (p) { state.person = +p.dataset.p; update(); if (GP.narrow()) $("personOut").scrollIntoView({ behavior: "smooth", block: "start" }); }
  });
  $("school").addEventListener("change", () => {
    const v = $("school").value.trim().toLowerCase();
    const i = schoolIndex.has(v) ? schoolIndex.get(v) : v ? data.schools.findIndex((s) => s[0].toLowerCase().startsWith(v)) : -1;
    state.school = i; state.season = 0; update();
  });
  $("role").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.role = b.dataset.v; update(); } });

  // ---------- a person's career ----------
  function renderPerson() {
    const out = $("personOut"), p = state.person;
    if (p < 0) { out.innerHTML = `<p class="empty">Pick a name in a staff list, or type one, to see that person's seasons school by school.</p>`; return; }
    // runs of seasons at the same school with the same title
    const ks = byPerson[p].slice().sort((a, b) => ST.y[a] - ST.y[b] || ST.s[a] - ST.s[b]), runs = [];
    for (const k of ks) {
      const last = runs.find((r) => r.s === ST.s[k] && r.t === ST.t[k] && r.to >= ST.y[k] - 1 && r === runs.filter((x) => x.s === ST.s[k]).pop());
      if (last) last.to = ST.y[k]; else runs.push({ s: ST.s[k], t: ST.t[k], r: ST.r[k], from: ST.y[k], to: ST.y[k] });
    }
    runs.sort((a, b) => b.from - a.from || b.to - a.to);
    const schools = new Set(ks.map((k) => ST.s[k])), heads = ks.filter((k) => ST.r[k] === HEAD).length;
    const nMoves = MV.p.filter((x) => x === p).length;
    out.innerHTML = `<h2 id="personTitle">${esc(people[p])}</h2>
      <p class="note">${fmt(ks.length)} season${ks.length === 1 ? "" : "s"} on a staff page at ${fmt(schools.size)} school${schools.size === 1 ? "" : "s"}${heads ? ` · head coach in ${fmt(heads)}` : ""}${nMoves ? ` · ${fmt(nMoves)} move${nMoves === 1 ? "" : "s"} between schools` : ""}</p>
      <ol class="career">${runs.map((r) => `<li class="${r.r === HEAD ? "head-job" : ""}"><span class="yr">${span(r.from, r.to)}</span><span><button type="button" class="nmb" data-s="${r.s}" data-y="${r.to}">${swatch(r.s)}${esc(data.schools[r.s][0])}</button><span class="t">${esc(data.titles[r.t] || RL[r.r])}</span></span></li>`).join("")}</ol>
      <p class="fine">Only the schools and seasons in this data: ${esc(sportWords.toLowerCase())} programs whose staff pages were found, ${span(FIRST, LAST)}. Jobs elsewhere (high schools, the pros, other sports) and seasons a school didn't post aren't here. People are matched by name, so two coaches with the same name can be mixed together.</p>`;
  }
  $("personOut").addEventListener("click", (e) => {
    const b = e.target.closest("[data-s]"); if (!b) return;
    state.school = +b.dataset.s; state.season = +b.dataset.y; update();
    if (GP.narrow()) $("schoolOut").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  // ---------- name search ----------
  const lower = people.map((n) => n.toLowerCase());
  let hits = [], cur = -1;
  function lastSchool(p) { const ks = byPerson[p]; let best = ks[0]; for (const k of ks) if (ST.y[k] > ST.y[best]) best = k; return best === undefined ? "" : `${data.schools[ST.s[best]][0]}, ${lab(ST.y[best])}`; }
  function suggest() {
    const q = $("who").value.trim().toLowerCase(), box = $("sugg");
    hits = [];
    if (q.length >= 2) {
      const words = q.split(/\s+/);
      for (let i = 0; i < lower.length && hits.length < 200; i++) {
        const n = lower[i];
        if (words.every((w) => n.startsWith(w) || n.includes(" " + w))) hits.push(i);
      }
      hits.sort((a, b) => (lower[b].startsWith(q) - lower[a].startsWith(q)) || byPerson[b].length - byPerson[a].length);
      hits = hits.slice(0, 12);
    }
    cur = -1;
    box.innerHTML = hits.map((p, j) => `<li role="option" id="sg${j}" data-p="${p}" aria-selected="false">${esc(people[p])}<small>${esc(lastSchool(p))}</small></li>`).join("") || (q.length >= 2 ? `<li aria-disabled="true">No one by that name</li>` : "");
    box.hidden = q.length < 2; $("who").setAttribute("aria-expanded", !box.hidden);
  }
  function choose(p) { $("sugg").hidden = true; $("who").setAttribute("aria-expanded", "false"); $("who").value = ""; state.person = p; update(); }
  $("who").addEventListener("input", suggest);
  $("who").addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (!hits.length) return;
      cur = (cur + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
      $("sugg").querySelectorAll("li").forEach((li, j) => li.setAttribute("aria-selected", j === cur));
      $("who").setAttribute("aria-activedescendant", "sg" + cur);
    } else if (e.key === "Enter" && hits.length) { e.preventDefault(); choose(hits[Math.max(0, cur)]); }
    else if (e.key === "Escape") { $("sugg").hidden = true; }
  });
  $("sugg").addEventListener("pointerdown", (e) => { const li = e.target.closest("[data-p]"); if (li) { e.preventDefault(); choose(+li.dataset.p); } });
  $("who").addEventListener("blur", () => setTimeout(() => { $("sugg").hidden = true; }, 150));

  // ---------- links: staff-directory.html#school=Alabama&season=2024&person=Kalen%20DeBoer ----------
  let lastHash = "";
  function hashNow() {
    const q = new URLSearchParams();
    if (state.school >= 0) { q.set("school", data.schools[state.school][0]); if (state.season) q.set("season", state.season); }
    if (state.role !== "coach") q.set("show", state.role);
    if (state.person >= 0) q.set("person", people[state.person]);
    return q.toString();
  }
  function readUrl(firstLoad) {
    let hash = location.hash.slice(1);
    if (!hash && firstLoad) hash = GP.readSaved("staff-directory:last") || "";
    const q = new URLSearchParams(hash), sc = (q.get("school") || "").toLowerCase();
    state.school = schoolIndex.has(sc) ? schoolIndex.get(sc) : -1;
    state.season = +q.get("season") || 0;
    state.role = q.get("show") === "all" ? "all" : "coach";
    const ids = nameIndex.get((q.get("person") || "").toLowerCase()) || [];
    state.person = ids.length ? ids.slice().sort((a, b) => byPerson[b].length - byPerson[a].length)[0] : -1;
    // a person with no school picked: show their latest school
    if (state.school < 0 && state.person >= 0) { const ks = byPerson[state.person]; const k = ks.reduce((a, b) => (ST.y[b] > ST.y[a] ? b : a), ks[0]); state.school = ST.s[k]; state.season = ST.y[k]; }
  }
  function update() {
    renderSchool(); renderPerson();
    const h = hashNow(); lastHash = h;
    try { localStorage.setItem(GP.saveKey("staff-directory:last"), h); } catch (e) {}
    try { history.replaceState(null, "", location.pathname + location.search + (h ? "#" + h : "")); } catch (e) {}
    $("movesLink").href = "staff-moves.html" + (state.school >= 0 ? "#school=" + encodeURIComponent(data.schools[state.school][0]) : "");
  }
  addEventListener("hashchange", () => { if (location.hash.slice(1) !== lastHash) { readUrl(); update(); } });
  $("share").addEventListener("click", () => { GP.copyLink($("toast")); });
  readUrl(true);
  $("loading").remove();
  update();
})();
</script>
</body>
</html>
